<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <header class="topbar">
    <a class="brand" href="#/"><img src="icons/icon.svg" alt="" class="brand-mark" width="28" height="28">BoxPing</a>

  <main id="view" tabindex="-1"><p class="muted center">Loading…</p></main>

    BoxPing is a neighbour project, not affiliated with Canada Post. Alerts are relayed by <a href="https://ntfy.sh" target="_blank" rel="noopener noreferrer">ntfy.sh</a>.

  <div id="print-area" aria-hidden="true"></div>
